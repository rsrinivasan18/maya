<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MAYA – Your Learning Companion</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>

<!-- ── PIN lock screen ──────────────────────────────────────────────── -->
<div id="pin-overlay">
  <div id="pin-box">
    <div class="pin-logo">✦ MAYA</div>
    <div class="pin-sub">Your Learning Companion</div>

    <div class="pin-dots" id="pin-dots">
      <span class="pin-dot" id="pin-d0"></span>
      <span class="pin-dot" id="pin-d1"></span>
      <span class="pin-dot" id="pin-d2"></span>
      <span class="pin-dot" id="pin-d3"></span>
    </div>
    <div class="pin-error" id="pin-error" hidden>Galat PIN hai! Try again</div>

    <div class="pin-pad">
      <button class="pin-key" data-n="1">1</button>
      <button class="pin-key" data-n="2">2</button>
      <button class="pin-key" data-n="3">3</button>
      <button class="pin-key" data-n="4">4</button>
      <button class="pin-key" data-n="5">5</button>
      <button class="pin-key" data-n="6">6</button>
      <button class="pin-key" data-n="7">7</button>
      <button class="pin-key" data-n="8">8</button>
      <button class="pin-key" data-n="9">9</button>
      <span class="pin-key-empty"></span>
      <button class="pin-key" data-n="0">0</button>
      <button class="pin-key pin-key-del" id="pin-del">⌫</button>
    </div>
  </div>
</div>

<div id="app">

  <!-- ── Header ──────────────────────────────────────────────────────── -->
  <header id="header">
    <span class="logo">✦ MAYA</span>
    <span id="status-dot" class="status-dot offline" title="Connection status"></span>
    <span id="status-text" class="status-text">connecting…</span>

    <div class="header-controls">
      <!-- hidden inputs — kept for app.js compatibility, not shown to Srinika -->
      <select id="model-select" hidden aria-hidden="true">
        <option value="auto">Auto</option>
      </select>
      <select id="agent-select" hidden aria-hidden="true">
        <option value="auto">Auto</option>
        <option value="science">Science</option>
        <option value="math">Math</option>
        <option value="story">Story</option>
        <option value="general">General</option>
      </select>
      <button id="voice-toggle" class="icon-btn" title="Voice output off — click to enable" aria-label="Toggle voice output">
        🔇
      </button>
    </div>
  </header>

  <!-- Overlay for mobile sidebar -->
  <div id="sidebar-overlay" class="sidebar-overlay"></div>

  <!-- ── Body ────────────────────────────────────────────────────────── -->
  <div id="body">

    <!-- ── Sidebar ──────────────────────────────────────────────────── -->
    <aside id="sidebar" class="sidebar">

      <!-- Tab bar -->
      <div class="sidebar-tabs">
        <button class="sidebar-tab active" data-tab="history">📚 History</button>
        <button class="sidebar-tab" data-tab="reminders" id="reminders-tab">
          ✅ Reminders<span id="todo-badge" class="todo-badge" hidden></span>
        </button>
        <button class="sidebar-tab" data-tab="persona">✦ Persona</button>
      </div>

      <!-- History panel -->
      <div id="panel-history" class="sidebar-panel">
        <div class="sidebar-section">
          <h3>Recent Topics</h3>
          <ul id="recent-topics" class="topic-list">
            <li class="empty">No topics yet</li>
          </ul>
        </div>
        <div class="sidebar-section">
          <h3>Mastery</h3>
          <ul id="mastery-list" class="mastery-list">
            <li class="empty">Start exploring!</li>
          </ul>
        </div>
        <div class="sidebar-section">
          <button class="clear-history-btn" onclick="clearAllHistory()">Clear all history</button>
        </div>
      </div>

      <!-- Reminders panel -->
      <div id="panel-reminders" class="sidebar-panel" hidden>
        <div class="sidebar-section">
          <h3>My Reminders</h3>
          <ul id="todo-list" class="todo-list">
            <li class="empty">No reminders yet!</li>
          </ul>
        </div>
        <div class="sidebar-section todo-add-section">
          <input type="text" id="todo-input" class="todo-input" placeholder="Add a reminder…" maxlength="200" />
          <input type="date" id="todo-due" class="todo-due" title="Due date (optional)" />
          <button id="todo-add-btn" class="todo-add-btn">+ Add</button>
        </div>
      </div>

      <!-- Persona panel -->
      <div id="panel-persona" class="sidebar-panel" hidden>
        <div class="sidebar-section">
          <h3>Persona Settings</h3>
          <p class="pf-hint">Changes take effect on your next message.</p>
          <div class="persona-form">
            <label class="pf-label">Tone</label>
            <textarea class="pf-field" id="pf-tone" rows="2"></textarea>
            <label class="pf-label">Language</label>
            <textarea class="pf-field" id="pf-language" rows="2"></textarea>
            <label class="pf-label">Grade Level</label>
            <textarea class="pf-field" id="pf-grade_level" rows="2"></textarea>
            <label class="pf-label">Greeting Style</label>
            <textarea class="pf-field" id="pf-greeting_style" rows="3"></textarea>
            <label class="pf-label">Response Style</label>
            <textarea class="pf-field" id="pf-response_style" rows="3"></textarea>
            <label class="pf-label">Avoid</label>
            <textarea class="pf-field" id="pf-avoid" rows="3"></textarea>
            <button id="save-persona-btn" class="save-persona-btn">Save Changes</button>
          </div>
        </div>
      </div>

      <!-- Save toast -->
      <div id="persona-toast" class="persona-toast" hidden>✓ Saved</div>

    </aside>

    <!-- ── Chat main ─────────────────────────────────────────────────── -->
    <main id="chat-main">

      <!-- MAYA hero eyes + caption -->
      <div id="maya-hero">
        <div id="maya-eyes-container">
          <div id="maya-p5-canvas"></div>
          <div id="emotion-label" class="emotion-label">idle</div>
        </div>
        <div id="maya-caption" aria-live="polite"></div>
      </div>

      <!-- Resize handle — drag to adjust hero height -->
      <div id="hero-resize" class="hero-resize" title="Drag to resize"></div>

      <!-- Message thread -->
      <div id="messages" class="messages" role="log" aria-live="polite" aria-label="Conversation">
        <!-- Messages added by JS -->
      </div>

      <!-- Thinking indicator (hidden until LLM is working) -->
      <div id="thinking" class="thinking-indicator" hidden aria-live="polite" aria-label="MAYA is thinking">
        <span id="thinking-emoji">🦋</span>
        <div class="thinking-dots" aria-hidden="true">
          <span></span><span></span><span></span>
        </div>
        <span class="thinking-text">hmm, let me think… ✨</span>
      </div>

      <!-- Input area -->
      <div class="input-area">
        <textarea
          id="input"
          placeholder="Ask me anything, Srinika!"
          rows="1"
          aria-label="Message input"
          autocomplete="off"
          spellcheck="true"
        ></textarea>
        <button id="mic-btn" class="mic-btn" title="Hold to speak" aria-label="Hold to speak, release to send">
          🎤
        </button>
        <button id="send-btn" class="send-btn" disabled title="Send message (Enter)" aria-label="Send">
          ➤
        </button>
      </div>

    </main>
  </div><!-- /#body -->

</div><!-- /#app -->

<script src="/static/app.js"></script>
<script src="/static/p5.min.js"></script>
<script src="/static/maya_eyes.js"></script>
</body>
</html>
